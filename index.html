<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline Bible</title>
  <link rel="stylesheet" href="reader/style.css">
</head>
<body>
  <header class="bar">
    <div class="nav">
      <button id="prev" class="icon" title="Previous chapter (←)" aria-label="Previous chapter">‹</button>
      <select id="book" aria-label="Book"></select>
      <select id="chapter" aria-label="Chapter"></select>
      <button id="next" class="icon" title="Next chapter (→)" aria-label="Next chapter">›</button>
    </div>
    <form id="search-form" class="search" role="search">
      <input id="q" type="search" placeholder="Search or go to John 3:16" autocomplete="off" aria-label="Search">
    </form>
    <div class="tools">
      <button id="smaller" class="icon" title="Smaller text" aria-label="Smaller text">A−</button>
      <button id="larger" class="icon" title="Larger text" aria-label="Larger text">A+</button>
      <button id="theme" class="icon" title="Toggle dark mode" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    </div>
  </header>

  <main id="main">
    <article id="reader" aria-live="polite"></article>
    <section id="results" hidden></section>
  </main>

  <noscript><p class="msg">This reader needs JavaScript enabled.</p></noscript>
  <script src="data/kjv/kjv.js"></script>
  <script src="reader/app.js"></script>
</body>
</html>

name: Android release

# Push a tag like v1.1 to build the APK and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        env:
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          android/build-apk.sh
          mv android/build/OfflineBible.apk "OfflineBible-${VERSION_NAME}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" OfflineBible-*.apk \
            --title "Offline Bible ${TAG#v}" \
            --notes "Offline KJV Bible reader for Android 5.0 and newer. Download the APK below and open it on your phone to install. It needs no permissions and works without internet."

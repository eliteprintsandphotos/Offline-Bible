name: Android release

# Build the APK and publish it as a GitHub release, either by pushing a tag like v1.1
# or from the Actions tab ("Run workflow"), which creates the tag on the chosen commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, e.g. v1.1
        required: true
        default: v1.0

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Tag must look like v1.2, got '$TAG'" >&2; exit 1;; esac
          export VERSION_NAME="${TAG#v}"
          android/build-apk.sh
          mv android/build/OfflineBible.apk "OfflineBible-${VERSION_NAME}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" OfflineBible-*.apk --target "$GITHUB_SHA" \
            --title "Offline Bible ${TAG#v}" \
            --notes "Offline KJV Bible reader for Android 5.0 and newer. Download the APK below and open it on your phone to install. It needs no permissions and works without internet."
